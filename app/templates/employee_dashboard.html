<!--
  employee_dashboard.html
  -------------------------
  Three tabs: Products (browse-only), Customers (browse-only), and
  New Bill (the main workflow — add items to a cart, enter customer
  details, generate the bill). Logic lives in static/js/employee.js.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee — Inventory System</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">

<style>
:root{color-scheme:dark;--bg:#080d18;--surface:#101a2b;--surface2:#142238;--line:rgba(148,163,184,.15);--text:#edf4ff;--muted:#91a2bb;--accent:#7c5cff;--cyan:#37d9e8;--good:#39d6a2;--shadow:0 24px 70px rgba(0,0,0,.32)}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,rgba(91,75,205,.20),transparent 34%),radial-gradient(ellipse at 90% 18%,rgba(30,190,210,.12),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.55}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 80%)}
button,input,select{font:inherit}
button{cursor:pointer}
.dash-wrap{position:relative;z-index:1;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;max-width:1800px;margin:auto}
.sidebar{position:sticky;top:0;height:100vh;padding:30px 18px;background:rgba(10,17,31,.88);border-right:1px solid var(--line);backdrop-filter:blur(22px);display:flex;flex-direction:column;gap:9px}
.brand{font:700 21px 'Space Grotesk',sans-serif;letter-spacing:-.7px;padding:10px 13px 28px;margin-bottom:12px;color:#fff}
.brand:before{content:"✦";display:inline-grid;place-items:center;width:34px;height:34px;margin-right:10px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#36c9df);box-shadow:0 8px 24px #6855dd55}
.brand small{display:block;margin:9px 0 0 46px;color:var(--muted);font:600 9px Inter,sans-serif;letter-spacing:2px}
.nav-item,.logout-btn{position:relative;width:100%;border:1px solid transparent;border-radius:12px;padding:12px 14px;text-align:left;color:#9eacc3;background:transparent;transition:background .22s,border-color .22s,color .22s,transform .22s}
.nav-item:before{display:inline-block;width:24px;color:#8294b3;font-size:15px}
.nav-item[data-tab="overview"]:before{content:"◫"}.nav-item[data-tab="employees"]:before{content:"♙"}.nav-item[data-tab="categories"]:before{content:"▦"}.nav-item[data-tab="products"]:before{content:"◇"}.nav-item[data-tab="sales"]:before{content:"↗"}.nav-item[data-tab="offers"]:before{content:"✧"}
.nav-item:hover,.logout-btn:hover{background:rgba(124,92,255,.11);border-color:rgba(124,92,255,.2);color:#fff;transform:translateX(3px)}
.nav-item.active{background:linear-gradient(100deg,rgba(124,92,255,.23),rgba(55,217,232,.07));border-color:rgba(142,119,255,.28);color:#fff;box-shadow:inset 3px 0 var(--accent)}
.logout-btn{margin-top:auto;color:#ff9eaa;border-color:rgba(255,115,135,.13);background:rgba(255,115,135,.05)}
.content{width:100%;max-width:1450px;padding:48px clamp(22px,4vw,64px) 70px;margin:0 auto}
.content-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px;animation:rise .55s both}
.content-header h2{font:700 clamp(27px,3vw,36px) 'Space Grotesk',sans-serif;letter-spacing:-1.2px;margin:0;color:#f7f9ff}
.content-header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.content-header:after{content:"";width:76px;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--cyan));box-shadow:0 0 24px #7c5cff66}
.tab-section{animation:rise .42s both}
.panel{position:relative;overflow:hidden;margin:0 0 22px;padding:25px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(20,34,56,.94),rgba(13,23,39,.94));box-shadow:var(--shadow);animation:rise .5s both;transition:transform .25s,border-color .25s}
.panel:hover{border-color:rgba(124,92,255,.28)}
.panel h3{margin:0 0 16px;font:600 18px 'Space Grotesk',sans-serif;color:#f1f5ff}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end;gap:18px}
.form-grid>div{min-width:0}
label{display:block;margin:0 0 8px;color:#b8c5d9;font-size:12px;font-weight:700;letter-spacing:.45px}
input,select{width:100%;min-height:46px;padding:11px 13px;border:1px solid rgba(148,163,184,.2);border-radius:10px;outline:none;background:#0b1423;color:var(--text);transition:border-color .2s,box-shadow .2s,background .2s}
input::placeholder{color:#687a95}
input:focus,select:focus{border-color:#8b75ff;box-shadow:0 0 0 3px rgba(124,92,255,.16);background:#101d31}
select option{background:#101a2b;color:#fff}
.btn-primary{min-height:46px;padding:11px 20px;border:0;border-radius:10px;background:linear-gradient(110deg,#7657f6,#328edc 70%,#29c3ce);color:#fff;font-weight:700;box-shadow:0 10px 25px rgba(91,88,226,.25);transition:transform .2s,filter .2s,box-shadow .2s}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 14px 30px rgba(91,88,226,.35)}
.btn-primary:active{transform:translateY(0)}
table{width:100%;border-collapse:collapse;min-width:580px;font-size:13px}
.panel:has(table){overflow-x:auto}
th{padding:13px 14px;text-align:left;color:#9cacc5;background:rgba(5,12,24,.35);font-size:10px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
td{padding:15px 14px;border-bottom:1px solid rgba(148,163,184,.1);color:#dce6f5}
tbody tr{transition:background .18s}
tbody tr:hover{background:rgba(124,92,255,.07)}
tbody tr:last-child td{border-bottom:0}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:22px}
.stat-row>*{border:1px solid var(--line);border-radius:16px;background:linear-gradient(140deg,#172744,#101a2b);padding:21px;box-shadow:var(--shadow);animation:rise .55s both}
.bill-cart{margin-top:24px;padding:18px;border:1px dashed rgba(148,163,184,.25);border-radius:13px;background:rgba(5,12,24,.25);color:var(--muted)}
.bill-total{margin-top:15px;color:#fff;font:700 23px 'Space Grotesk',sans-serif;text-align:right}
.receipt-preview{display:grid;justify-items:center;gap:12px;padding:18px;text-align:center}
.receipt-preview img{max-width:180px;border-radius:12px;padding:8px;background:#fff}
#receipt-panel{border-color:rgba(57,214,162,.3)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
@media(max-width:800px){.dash-wrap{grid-template-columns:1fr}.sidebar{position:sticky;z-index:20;top:0;height:auto;padding:12px 14px;display:flex;flex-direction:row;align-items:center;gap:7px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.brand{flex:0 0 auto;padding:5px 10px;margin:0 8px 0 0;font-size:15px}.brand:before{width:28px;height:28px;border-radius:9px}.brand small{margin:4px 0 0 38px;font-size:7px}.nav-item,.logout-btn{width:auto;flex:0 0 auto;padding:10px 12px;white-space:nowrap;font-size:12px}.nav-item:before{width:17px}.logout-btn{margin:0 0 0 auto}.content{padding:30px 18px 50px}.panel{padding:19px;border-radius:15px}}
@media(max-width:520px){.sidebar{gap:5px}.brand{font-size:0;padding:5px;margin-right:3px}.brand:before{margin:0}.brand small{display:none}.nav-item,.logout-btn{padding:9px 10px;font-size:11px}.nav-item:before{display:none}.content{padding:25px 13px 40px}.content-header{margin-bottom:21px}.content-header:after{width:42px}.panel{padding:16px;margin-bottom:16px}.form-grid{grid-template-columns:1fr;gap:14px}.stat-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat-row>*{padding:15px}.bill-total{text-align:left}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

</head>
<body>
  <div class="dash-wrap">
    <aside class="sidebar">
      <div class="brand">Staff Counter<small>INVENTORY SYSTEM</small></div>
      <button class="nav-item active" data-tab="bill" onclick="showTab('bill')">New bill</button>
      <button class="nav-item" data-tab="products" onclick="showTab('products')">Products</button>
      <button class="nav-item" data-tab="customers" onclick="showTab('customers')">Customers</button>
      <button class="logout-btn" onclick="logout()">Log out</button>
    </aside>

    <main class="content">

      <!-- New Bill -->
      <section id="tab-bill" class="tab-section active">
        <div class="content-header"><div><h2>New bill</h2><p>Add items, enter the customer, generate a receipt</p></div></div>

        <div class="panel">
          <div class="form-grid">
            <div><label>Product</label><select id="bill-product"></select></div>
            <div><label>Quantity</label><input id="bill-qty" type="number" min="1" value="1"></div>
            <button class="btn-primary" type="button" onclick="addToCart()">Add to bill</button>
          </div>

          <div class="bill-cart" id="bill-cart">
            <p style="color:var(--text-muted); font-size:14px;">No items added yet.</p>
          </div>
          <div class="bill-total" id="bill-total"></div>
        </div>

        <div class="panel">
          <h3 style="margin-bottom:14px;">Customer details</h3>
          <div class="form-grid">
            <div><label>Name</label><input id="cust-name" required></div>
            <div><label>Mobile number</label><input id="cust-mobile" required></div>
            <div><label>Email (for the receipt)</label><input id="cust-email" type="email"></div>
            <button class="btn-primary" type="button" onclick="generateBill()">Generate bill</button>
          </div>
        </div>

        <div class="panel" id="receipt-panel" style="display:none;">
          <h3>Receipt ready</h3>
          <div class="receipt-preview">
            <p id="receipt-summary"></p>
            <img id="receipt-qr" alt="Bill QR code">
            <p id="receipt-email-status" style="font-size:13px; color:var(--text-muted);"></p>
          </div>
        </div>
      </section>

      <!-- Products -->
      <section id="tab-products" class="tab-section">
        <div class="content-header"><div><h2>Products</h2><p>Full catalog and current stock</p></div></div>
        <div class="panel">
          <table>
            <thead><tr><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th></tr></thead>
            <tbody id="products-table"></tbody>
          </table>
        </div>
      </section>

      <!-- Customers -->
      <section id="tab-customers" class="tab-section">
        <div class="content-header"><div><h2>Customers</h2><p>Everyone who's been billed before</p></div></div>
        <div class="panel">
          <table>
            <thead><tr><th>Name</th><th>Mobile</th><th>Email</th></tr></thead>
            <tbody id="customers-table"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/employee.js"></script>
</body>
</html>
