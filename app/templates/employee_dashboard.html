<!--
  employee_dashboard.html
  -------------------------
  Three tabs: Products (browse-only), Customers (browse + fix the email of
  customers without an account), and New Bill (the main workflow — add items
  to a cart, enter customer details, generate the bill). Typing a saved mobile
  number auto-fills the customer and shows their member status.
  Logic lives in static/js/employee.js.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee — Inventory System</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="dash-wrap">
    <aside class="sidebar">
      <div class="brand">Staff Counter<small>INVENTORY SYSTEM</small></div>
      <button class="nav-item active" data-tab="bill" onclick="showTab('bill')">New bill</button>
      <button class="nav-item" data-tab="products" onclick="showTab('products')">Products</button>
      <button class="nav-item" data-tab="customers" onclick="showTab('customers')">Customers</button>
      <button class="logout-btn" onclick="logout()">Log out</button>
    </aside>

    <main class="content">

      <!-- New Bill -->
      <section id="tab-bill" class="tab-section active">
        <div class="content-header"><div><h2>New bill</h2><p>Add items, enter the customer, generate a receipt</p></div></div>

        <div class="panel">
          <div class="form-grid">
            <div><label>Product</label><select id="bill-product"></select></div>
            <div><label>Quantity</label><input id="bill-qty" type="number" min="1" value="1"></div>
            <button class="btn-primary" type="button" onclick="addToCart()">Add to bill</button>
          </div>

          <div class="bill-cart" id="bill-cart">
            <p style="color:var(--text-muted); font-size:14px;">No items added yet.</p>
          </div>
          <div class="bill-total" id="bill-total"></div>
        </div>

        <div class="panel">
          <h3 style="margin-bottom:14px;">Customer details</h3>
          <div class="form-grid">
            <div><label>Mobile number</label><input id="cust-mobile" required placeholder="Type a saved number to auto-fill"></div>
            <div><label>Name</label><input id="cust-name" required></div>
            <div><label>Email (for the receipt)</label><input id="cust-email" type="email"></div>
            <button class="btn-primary" type="button" onclick="generateBill()">Generate bill</button>
          </div>
          <div class="member-chip" id="member-chip"></div>
        </div>

        <div class="panel" id="receipt-panel" style="display:none;">
          <h3>Receipt ready</h3>
          <div class="receipt-preview">
            <p id="receipt-summary"></p>
            <img id="receipt-qr" alt="Bill QR code">
            <p id="receipt-email-status" style="font-size:13px; color:var(--text-muted);"></p>
          </div>
        </div>
      </section>

      <!-- Products -->
      <section id="tab-products" class="tab-section">
        <div class="content-header"><div><h2>Products</h2><p>Full catalog and current stock</p></div></div>
        <div class="panel">
          <table>
            <thead><tr><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th></tr></thead>
            <tbody id="products-table"></tbody>
          </table>
        </div>
      </section>

      <!-- Customers -->
      <section id="tab-customers" class="tab-section">
        <div class="content-header"><div><h2>Customers</h2><p>Everyone who's been billed before</p></div></div>
        <div class="panel">
          <table>
            <thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Account</th><th></th></tr></thead>
            <tbody id="customers-table"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/employee.js"></script>
</body>
</html>
